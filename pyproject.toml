[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2m"
version = "0.1.0"
description = "Migrate Apigee proxy bundles to Mule 4 projects"
requires-python = ">=3.11"
# defusedxml parses untrusted bundle XML without resolving entities (standards rule 4).
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
# ruff and mypy are the project's static checks; CP1-T55/T61 run them.
dev = ["pytest>=8", "ruff>=0.16", "mypy>=2.4", "types-defusedxml>=0.7", "textual>=8.2.8,<9", "textual-dev>=1.8"]
# The Anthropic SDK for --llm claude (the default); imported lazily, so a2m runs without it with --llm fake.
claude = ["anthropic>=0.40"]
# Textual for the terminal UI (`a2m tui`); imported lazily, so the plain command line runs without it.
tui = ["textual>=8.2.8,<9"]

[project.scripts]
a2m = "a2m.cli:main"

[tool.setuptools.packages.find]
include = ["a2m*"]

[tool.setuptools.package-data]
# The generator's fixed project files (pom.xml), read with importlib.resources.
"a2m.generator" = ["templates/*"]
# The AI prompts (data, editable without touching code) and the fake provider's built-in answers.
"a2m" = ["prompts/*.md"]
"a2m.ai" = ["canned/*.json"]
# The terminal UI's stylesheet.
"a2m.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Runtime tests need Java, Maven and Mule; run them with -m "runtime or not runtime".
addopts = "-m 'not runtime'"
markers = [
    "runtime: needs Java, Maven and the Mule runtime installed",
]
# Runtime tests leave about 1 GB per session under pytest's tmp folder (Mule bases, Maven
# builds) and /tmp has a small per-user quota. A passing session removes its whole tmp
# folder at the end, session-scoped ones included; a failing session keeps its own for
# debugging and removes every older one, so at most one failed run is ever kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
# The code base wraps at about 120 characters; ruff's default of 88 would make
# isort rewrap one-line imports (I001) that fit the project's own style.
line-length = 120
target-version = "py311"
# Apigee bundle fixtures hold the proxies' own JavaScript and Python callout scripts (input data written against
# Apigee's object model, e.g. a global `response`), not a2m code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# The round-01 and round-02 test blocks import mid-file so no locked test line
# changes; E402 makes their `# noqa: E402` markers meaningful (not RUF100).
extend-select = ["E402"]

[tool.ruff.lint.per-file-ignores]
# These rules fire only on locked lines of this test file (CP1-T01 subprocess
# calls without check=, CP1-T17 string join), which may not be edited.
# Narrowly scoped to this one file; new code elsewhere is still checked.
"tests/test_cp1_cli.py" = ["PLW1510", "FLY002"]
# The CP7 tests' locked function-level import blocks were sorted while a2m.verify.runner and
# a2m.verify.compare did not exist yet (ruff then took them for third-party modules); now that
# they exist, isort wants those locked lines merged. Narrowly scoped to these two files.
"tests/test_cp7_verify.py" = ["I001"]
"tests/runtime/test_cp7_verify_runtime.py" = ["I001"]

# Settings of the generated Mule app: the port it listens on and the address of each target.
http.listener.host=0.0.0.0
http.listener.port=8081
# API keys that VerifyAPIKey Verify-Key accepts, comma-separated. Empty rejects every key: fill it in.
verifyapikey.Verify-Key.allowedKeys=
target.default.protocol=HTTPS
target.default.host=backend.example.test
target.default.port=443
target.default.basePath=/orders
